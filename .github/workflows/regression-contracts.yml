name: Regression contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full historical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned provenance trees
        shell: bash
        run: |
          set -euo pipefail
          command -v tar
          for commit in \
            5cc1eae473a6d6ba60f0bfb72b60b19cb6392854 \
            e3eae65cc641513041c379dcf2bed6845f323c4d \
            16018a6358261699a46a8bc3918e61b25bcc9f1e
          do
            git cat-file -e "${commit}^{commit}"
            git archive --format=tar "$commit" lib tests docs package.json > /dev/null
          done

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Verify versioned source and public replay contracts
        run: |
          node releases/2026-10-21/verify.mjs
          node --test releases/2026-10-21/reproduction/fixture-handler.test.mjs
      - name: Verify durable pricing without provider requests
        working-directory: releases/2026-10-21/source
        run: node --test tests/public-pricing-verifier.test.mjs tests/public-pricing-renewal.test.mjs tests/public-pricing-policy.test.mjs tests/public-planner-ledger.test.mjs tests/public-planner-round.test.mjs
      - name: Verify chart-first positions and intro controls
        working-directory: releases/2026-10-21/source
        run: node --test tests/position-dashboard.test.mjs tests/composer-prompt-helpers.test.mjs tests/home-orientation.test.mjs
      - name: Verify sourced workforce evidence and synthetic workload
        working-directory: releases/2026-10-21/source
        run: node --test tests/home-turnover-investigation.test.mjs tests/external-workforce-evidence.test.mjs tests/market-explorer.test.mjs tests/synthetic-capacity-risk.test.mjs tests/dashboard-risk-presentation.test.mjs tests/swp-capacity-cost.test.mjs tests/group-capacity-risk.test.mjs
      - name: Verify aggregate wording and missing survey states
        working-directory: releases/2026-10-21/source
        run: node --test tests/public-home-aggregate.test.mjs tests/urgent-missing-display.test.mjs tests/market-reference-carry.test.mjs tests/decision-brief-market-attribution.test.mjs
      - name: Verify planning empty states and public error references
        working-directory: releases/2026-10-21/source
        run: node --test tests/planning-empty-progress.test.mjs tests/home-public-error-reference.test.mjs tests/staffing-priority-presentation.test.mjs
      - name: Verify editorial clarity and actionable FTE answers
        working-directory: releases/2026-10-21/source
        run: node --test tests/home-bu-turnover-chat.test.mjs tests/canonical-worked-example.test.mjs tests/home-fte-investigation.test.mjs tests/market-reference-editorial.test.mjs tests/module-editorial-presentation.test.mjs tests/planner-editorial-presentation.test.mjs tests/projection-save-retry.test.mjs tests/public-recruiting-cohort-recovery.test.mjs tests/home-dataset-query.test.mjs tests/demo-company-profile.test.mjs tests/about-project-profile.test.mjs
      - name: Run regression contracts
        # The native Lab snapshot is independently scoped and must preserve saved plans.
        working-directory: releases/2026-10-21/source
        run: node --test tests/fow-lab.test.mjs tests/fow-lab-reference.test.mjs tests/home-answer-acceptance.test.mjs tests/home-turnover-groups.test.mjs tests/catalog-display.test.mjs tests/business-answer-presentation.test.mjs tests/home-historical-reply-clarity.test.mjs tests/overview-projection-entry.test.mjs tests/fow-work-model.test.mjs tests/home-cross-domain-acceptance.test.mjs tests/public-workforce-performance.test.mjs tests/public-occupational-detail.test.mjs tests/manual-plan-results.test.mjs tests/plan-result-review.test.mjs tests/decision-backup.test.mjs tests/decision-backup-store.test.mjs
      - name: Run historical regression contracts
        run: node --test --test-concurrency=4 tests/*.test.mjs
      - name: Verify generated artifacts without writing
        run: npm run prebuild
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit

